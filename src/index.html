<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <title>DeepSeek-Harness</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #8b949e;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 520px;
      padding: 0 24px;
      text-align: center;
    }

    /* Pure-CSS spinner — no inline script needed (CSP default-src 'self'). */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(139, 148, 158, 0.25);
      border-top-color: #4da3ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .title {
      color: #e6edf3;
      font-size: 16px;
      font-weight: 600;
    }

    /* Live status, updated by window-controls.js from the dsh-startup event. */
    .status {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.6;
    }

    .status.error {
      color: #f85149;
      font-weight: 600;
    }

    .hint {
      font-size: 12px;
      color: #6e7681;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="spinner"></div>
    <div class="title">正在启动 DeepSeek Harness…</div>
    <div id="dsh-startup-status" class="status">正在定位 dsh…</div>
    <div class="hint">首次开机启动可能较慢：需要冷启动 dsh 服务和 WebView 运行时，请耐心等待。</div>
  </div>
</body>
</html>

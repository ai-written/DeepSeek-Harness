[package]
name = "deepseek-harness"
version = "0.1.8"
description = "DeepSeek-Harness — Tauri desktop shell embedding the DeepSeek Harness web UI (dsh web)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
